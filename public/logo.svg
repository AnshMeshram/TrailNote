<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="680" height="160">
  <defs>
    <linearGradient id="logoPaperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0" />
      <stop offset="100%" stop-color="#EDE7D5" />
    </linearGradient>

    <linearGradient id="logoSpruceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D461E" />
      <stop offset="100%" stop-color="#1A2D12" />
    </linearGradient>

    <linearGradient id="logoLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#558C16" />
      <stop offset="60%" stop-color="#3A6704" />
      <stop offset="100%" stop-color="#243A18" />
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14200E" flood-opacity="0.2" />
    </filter>
  </defs>

