    <line x1="64" y1="48" x2="77" y2="43" stroke="#FAF7F0" stroke-width="1.4" stroke-linecap="round" opacity="0.8" />
    <line x1="64" y1="60" x2="77" y2="61" stroke="#FAF7F0" stroke-width="1.4" stroke-linecap="round" opacity="0.8" />
